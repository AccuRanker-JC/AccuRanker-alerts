name: AccuRanker rank 1 with top ad check

on:
  schedule:
    - cron: "3 4 * * *"   # 04:03 Copenhagen time (same time as the other checks)
      timezone: "Europe/Copenhagen"
  workflow_dispatch: {}    # allows manual triggering for testing

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rank 1 with top ad check
        env:
          ACCURANKER_API_KEY: ${{ secrets.ACCURANKER_API_KEY }}
          ACCURANKER_ADS_TOP_DOMAIN_ID: ${{ vars.ACCURANKER_ADS_TOP_DOMAIN_ID }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          EMAIL_METHOD: ${{ vars.EMAIL_METHOD }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python agents/rank1_ads_top_check.py

      - name: Save updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --quiet --cached || git commit -m "Update state: rank 1 with top ad check"
          git push
