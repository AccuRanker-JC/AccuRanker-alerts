name: AccuRanker preferred URL check

on:
  schedule:
    - cron: "03 4 * * *"   # kl. 04:13 hver dag
      timezone: "Europe/Copenhagen"
  workflow_dispatch: {}    # gør det muligt at trigge manuelt til test

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer dependencies
        run: pip install -r requirements.txt

      - name: Kør preferred URL-tjek
        env:
          ACCURANKER_API_KEY: ${{ secrets.ACCURANKER_API_KEY }}
          ACCURANKER_DOMAIN_ID: ${{ vars.ACCURANKER_DOMAIN_ID }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          EMAIL_METHOD: ${{ vars.EMAIL_METHOD }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python agents/preferred_url_check.py

      - name: Gem opdateret tilstand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --quiet --cached || git commit -m "Opdater tilstand: preferred URL-tjek"
          git push
